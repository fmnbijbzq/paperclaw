[project]
name = "paperclaw"
version = "0.1.0"
description = "AI vision paper crawler"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "pypdf",
    "jinja2",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that send real network requests to external services",
]
